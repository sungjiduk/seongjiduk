<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>성지덕 · 프로젝트 진행상황 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f5b642;--verm:#e2503a;--blue:#6b7bb0;--ink:#141222}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0c0e1a;font-family:'Noto Sans KR',sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  canvas{display:block}
  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;padding:18px 22px;z-index:10;
    display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .brand{font-family:'Black Han Sans';font-size:1.3rem;letter-spacing:.04em}
  .brand small{display:block;font-family:'Noto Sans KR';font-weight:400;font-size:.72rem;color:#b9c1e0;letter-spacing:.14em;margin-top:2px}
  .today{text-align:right;background:rgba(18,15,30,.5);border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(10px);border-radius:14px;padding:12px 16px;pointer-events:auto}
  .today .d{font-family:'Black Han Sans';font-size:1.15rem;color:var(--gold)}
  .today .p{font-size:.78rem;color:#c7cde6;margin-top:3px}
  #prog{margin-top:8px;width:180px;height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
  #prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--verm))}
  #stage{margin-top:6px;font-size:.8rem;color:#fff}
  /* legend */
  #legend{position:fixed;left:22px;bottom:20px;z-index:10;display:flex;gap:16px;
    background:rgba(18,15,30,.5);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);
    border-radius:14px;padding:11px 16px;font-size:.8rem}
  #legend span{display:flex;align-items:center;gap:7px}
  .dot{width:11px;height:11px;border-radius:50%}
  .g{background:var(--gold)} .v{background:var(--verm)} .b{background:var(--blue)}
  #tip{position:fixed;right:22px;bottom:20px;z-index:10;font-size:.74rem;color:#9aa3c6;letter-spacing:.06em}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;z-index:20;padding:8vw;background:#0c0e1a}
  #err.show{display:flex}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;color:#c7cde6;letter-spacing:.2em;font-size:.9rem;background:#0c0e1a;transition:opacity .6s}
  #loading.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="brand">⛩ 성지덕 <small>PROJECT PROGRESS · 진행상황</small></div>
  <div class="today">
    <div class="d" id="today">2026-07-02</div>
    <div class="p">일정 기준 진행률</div>
    <div id="prog"><i></i></div>
    <div id="stage">현재 단계 —</div>
  </div>
</div>
<div id="legend">
  <span><i class="dot g"></i>완료</span>
  <span><i class="dot v"></i>진행 중</span>
  <span><i class="dot b"></i>예정</span>
</div>
<div id="tip">드래그: 회전 · 휠: 확대 · 자동 회전</div>
<div id="loading">여정 불러오는 중…</div>
<div id="err">WebGL/모듈을 불러오지 못했어요. 인터넷 연결 상태에서 최신 브라우저로 열어주세요.</div>

/* ---------- schedule data ---------- */
const STOPS = [
  {day:"06/29–30", title:"기획 & 설계",   s:"2026-06-29", e:"2026-06-30"},
  {day:"07/01–03", title:"인증 & 도메인", s:"2026-07-01", e:"2026-07-03"},
  {day:"07/04–06", title:"AI & 통계",     s:"2026-07-04", e:"2026-07-06"},
  {day:"07/07–08", title:"인프라 & 배포", s:"2026-07-07", e:"2026-07-08"},
  {day:"07/09",    title:"통합 & 마무리", s:"2026-07-09", e:"2026-07-09"},
  {day:"07/10",    title:"발표 🎤",       s:"2026-07-10", e:"2026-07-10"},
];
const PATH = [
  [-11,0.2,9],[-6.5,0.2,4.5],[-2,0.4,0.5],[3,0.3,-3],[7.5,0.5,-7.5],[11,0.6,-12.5]
];
const START=new Date("2026-06-29T00:00:00"), END=new Date("2026-07-10T23:59:59");
const NOW=new Date(); // 오늘 (재접속 시 자동 갱신)
const clampNow = new Date(Math.min(END, Math.max(START, NOW)));
const progT = (clampNow-START)/(END-START);
function statusOf(st){ const s=new Date(st.s), e=new Date(st.e+"T23:59:59");
  if(NOW>e) return "done"; if(NOW>=s&&NOW<=e) return "current"; return "todo"; }
const COL={done:0xf5b642,current:0xe2503a,todo:0x6b7bb0};

/* HUD text */
document.getElementById('today').textContent =
  NOW.getFullYear()+"-"+String(NOW.getMonth()+1).padStart(2,'0')+"-"+String(NOW.getDate()).padStart(2,'0');
document.querySelector('#prog i').style.width=Math.round(progT*100)+"%";
const curStop = STOPS.find(s=>statusOf(s)==="current") || (NOW>END?STOPS[STOPS.length-1]:STOPS[0]);
document.getElementById('stage').textContent="현재 단계 · "+curStop.day+" "+curStop.title;

let renderer,scene,camera,controls,mixer,clock,duck,todayFlag;
try{ init(); animate(); }
catch(e){ console.error(e); fail(); }
function fail(){ document.getElementById('err').classList.add('show'); document.getElementById('loading').classList.add('hide'); }
window.addEventListener('error',ev=>{ if(String(ev.message||'').match(/import|module|three/i)) fail(); });

function init(){
  const app=document.getElementById('app');
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  app.appendChild(renderer.domElement);

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0c0e1a);
  // 부드러운 스튜디오 조명 (예제와 동일한 RoomEnvironment 기법)
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  scene.fog=new THREE.Fog(0x0c0e1a,26,60);

  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
  camera.position.set(4,11,24);

  controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,1.5,-1);
  controls.enableDamping=true; controls.dampingFactor=0.06;
  controls.autoRotate=true; controls.autoRotateSpeed=0.55;
  controls.minDistance=10; controls.maxDistance=44;
  controls.maxPolarAngle=Math.PI*0.49;
  controls.update();

  // 은은한 보조광
  const key=new THREE.DirectionalLight(0xfff2d8,1.1); key.position.set(6,12,8); scene.add(key);
  scene.add(new THREE.HemisphereLight(0xbfd4ff,0x20233a,0.35));

  // 바닥 원반
  const ground=new THREE.Mesh(new THREE.CircleGeometry(26,64),
    new THREE.MeshStandardMaterial({color:0x1a1d33,roughness:0.95,metalness:0.0}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.01; scene.add(ground);

  // 경로 곡선
  const curve=new THREE.CatmullRomCurve3(PATH.map(p=>new THREE.Vector3(...p)));
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,160,0.09,10,false),
    new THREE.MeshStandardMaterial({color:0xf5b642,emissive:0x5a3d00,roughness:0.5}));
  scene.add(tube);

  // 정거장(플랫폼+토리이+상태 링+라벨)
  STOPS.forEach((st,i)=>{
    const stt=statusOf(st); const c=COL[stt];
    const p=new THREE.Vector3(...PATH[i]);
    // 플랫폼
    const plat=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.5,0.35,28),
      new THREE.MeshStandardMaterial({color:0x24284a,roughness:0.8}));
    plat.position.set(p.x,0.15,p.z); scene.add(plat);
    // 상태 링
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.08,12,40),
      new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:stt==="todo"?0.15:0.75,roughness:0.4}));
    ring.rotation.x=-Math.PI/2; ring.position.set(p.x,0.34,p.z); scene.add(ring);
    if(stt==="current") ring.userData.pulse=true, scene.userData.pulseRing=ring;
    // 토리이
    scene.add(torii(p.x,0.3,p.z,c,stt));
    // 번호 기둥
    // 라벨 스프라이트
    const lab=label((i+1)+"  "+st.day, st.title, c, stt);
    lab.position.set(p.x,3.5,p.z); lab.scale.set(4.2,1.6,1); scene.add(lab);
  });

  // "오늘" 깃발
  const fp=curve.getPointAt(Math.min(0.999,Math.max(0.001,progT)));
  todayFlag=flag(fp.x,fp.y,fp.z);
  scene.add(todayFlag);

  // 성지덕 (경로 순회 = AnimationMixer 키프레임)
  const traveler=new THREE.Group(); scene.add(traveler);
  const tex=new THREE.TextureLoader().load(DUCK_URI,()=>document.getElementById('loading').classList.add('hide'));
  tex.colorSpace=THREE.SRGBColorSpace;
  duck=new THREE.Mesh(new THREE.PlaneGeometry(2.4,2.4*734/560),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  duck.position.y=1.7; traveler.add(duck);

  // 키프레임 트랙: 곡선을 시간축에 샘플링
  const DUR=16, N=160, times=[], vals=[];
  for(let k=0;k<=N;k++){ const t=k/N; const v=curve.getPointAt(t);
    times.push(t*DUR); vals.push(v.x,v.y,v.z); }
  const track=new THREE.VectorKeyframeTrack('.position',times,vals);
  const clip=new THREE.AnimationClip('travel',DUR,[track]);
  mixer=new THREE.AnimationMixer(traveler);
  mixer.clipAction(clip).play(); // 무한 반복 순회

  clock=new THREE.Clock();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight); });
  // 이미지 실패해도 로딩 숨김
  setTimeout(()=>document.getElementById('loading').classList.add('hide'),2500);
}

function torii(x,y,z,c,stt){
  const g=new THREE.Group();
  const em=stt==="todo"?0.05:0.4;
  const m=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:em,roughness:0.55});
  const dark=new THREE.MeshStandardMaterial({color:0x241a18,roughness:0.7});
  const pil=new THREE.CylinderGeometry(0.11,0.13,2.4,12);
  const l=new THREE.Mesh(pil,m); l.position.set(-0.7,1.2,0); g.add(l);
  const r=new THREE.Mesh(pil,m); r.position.set(0.7,1.2,0); g.add(r);
  const top1=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.18,0.28),dark); top1.position.set(0,2.45,0); g.add(top1);
  const top2=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.13,0.22),m); top2.position.set(0,2.15,0); g.add(top2);
  g.position.set(x,y,z); return g;
}
function flag(x,y,z){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,3.4,8),
    new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4}));
  pole.position.y=1.7; g.add(pole);
  const cloth=new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.7),
    new THREE.MeshStandardMaterial({color:0xe2503a,emissive:0xe2503a,emissiveIntensity:0.6,side:THREE.DoubleSide}));
  cloth.position.set(0.62,3.0,0); g.add(cloth);
  g.add(label("오늘","YOU ARE HERE",0xffffff,"current",true).translateY(0));
  const spr=g.children[g.children.length-1]; spr.position.set(0,3.9,0); spr.scale.set(2.6,1.0,1);
  g.position.set(x,y,z); g.userData.bob=true; return g;
}
function label(t1,t2,color,stt,white){
  const c=document.createElement('canvas'); c.width=512; c.height=200; const x=c.getContext('2d');
  const hex="#"+color.toString(16).padStart(6,'0');
  x.fillStyle="rgba(16,14,28,0.82)"; roundRect(x,6,6,500,188,26); x.fill();
  x.strokeStyle=white?"#ffffff":hex; x.lineWidth=5; roundRect(x,6,6,500,188,26); x.stroke();
  x.textAlign="center";
  x.fillStyle=white?"#ffffff":hex; x.font="700 60px 'Black Han Sans',sans-serif";
  x.fillText(t1,256,88);
  x.fillStyle="#eef0ff"; x.font="500 40px 'Noto Sans KR',sans-serif";
  x.fillText(t2,256,150);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  return s;
}
function roundRect(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py);
  x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.getElapsedTime();
  if(mixer) mixer.update(dt);
  if(duck){ duck.quaternion.copy(camera.quaternion); duck.position.y=1.7+Math.sin(t*2.0)*0.12; }
  if(todayFlag){ todayFlag.position.y=PATHy(progT)+Math.sin(t*1.4)*0.12; todayFlag.rotation.y=t*0.6; }
  if(scene.userData.pulseRing){ const s=1+Math.sin(t*3.0)*0.06; scene.userData.pulseRing.scale.set(s,s,s); }
  controls.update();
  renderer.render(scene,camera);
}
function PATHy(t){ return 0.2 + t*0.4; }
</script>
