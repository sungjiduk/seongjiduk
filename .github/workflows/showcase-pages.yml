name: Showcase — progress & Pages deploy

# 진행률(progress.json) 집계 후 showcase/ 를 GitHub Pages로 배포한다.
# - 백엔드 repo의 PR 머지 알림(repository_dispatch)
# - 30분 주기 schedule
# - 수동 dispatch
# - showcase/ 변경 push(main)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [backend-pr-merged]
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/workflows/showcase-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: showcase-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 진행률 집계 (progress.json 생성)
        env:
          # 대상 repo가 같은 조직의 private repo이므로,
          # 조직 secret SHOWCASE_TOKEN(repo 읽기 PAT)이 있으면 사용하고,
          # 없으면 기본 GITHUB_TOKEN으로 폴백한다.
          GITHUB_TOKEN: ${{ secrets.SHOWCASE_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REPOS: sungjiduk/seongjiduk-backend
          OUT_FILE: showcase/data/progress.json
        run: node showcase/scripts/build-progress.mjs
        continue-on-error: true

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 산출물 업로드 (showcase/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
